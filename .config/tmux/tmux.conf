# ==========================================
# GENERAL KEYBINDINGS
# ==========================================

# enable reload config via shortcut
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# change prefix
unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

# change split windows keybindings
unbind %
bind '\' split-window -h -c '#{pane_current_path}'
unbind '"'
bind - split-window -v -c '#{pane_current_path}'

# resize windows like vim
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# maximixe and minimize pane
bind -r m resize-pane -Z

# enable the mouse
set -g mouse on

# ==========================================
# COPY MODE & VIM MOVEMENTS
# ==========================================

# set up vim movement for tmux
set-window-option -g mode-keys vi

# problem with gnome terminal that doesn't support coping via xterm (ensure xclip is installed)
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
###########################################
bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
#bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"
unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse

# ==========================================
# GRAPHICS
# ==========================================

# Enable True Color support
set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "screen-256color"

# 1. Base Status Line Colors (Deep Dark Blue/Gray)
set -g status-style "fg=#cdd6f4,bg=#1e1e2e,none"
set -g status-justify "left"

# 2. Status Left
set -g status-left-length 100
set -g status-left ""

# 3. Status Right (Username | Hostname)
# Soft Blue (#89b4fa) transitioning into Mauve/Purple (#cba6f7)
set -g status-right-length 150
set -g status-right "#[fg=#89b4fa,bg=#1e1e2e]#[fg=#1e1e2e,bg=#89b4fa,bold] #(whoami) #[fg=#cba6f7,bg=#89b4fa]#[fg=#1e1e2e,bg=#cba6f7,bold] #h "

# 4. Window Status (Unfocused)
# Muted Gray-Blue (#45475a) so it doesn't distract you
set -g window-status-format "#[fg=#cdd6f4,bg=#45475a] #I  #W #[fg=#45475a,bg=#1e1e2e,none]"

# 5. Window Status (Focused/Active)
# Mint Green (#a6e3a1) to clearly highlight exactly where you are
set -g window-status-current-format "#[fg=#1e1e2e,bg=#a6e3a1,bold] #I  #W #[fg=#a6e3a1,bg=#1e1e2e,none]"

# 6. Pane Borders
set -g pane-border-style "fg=#313244" # subtle dark border
set -g pane-active-border-style "fg=#cba6f7" # Mauve active border

# 7. Command Line / Message Prompt
set -g message-style "fg=#1e1e2e,bg=#a6e3a1,bold" # Mint green prompt

# 8. Copy Mode / Visual Selection Highlight
set -wg mode-style "fg=#1e1e2e,bg=#f9e2af,bold" # Soft yellow for highlighted text

# ==========================================
# SCRIPTS
# ==========================================

# tmux sessionizer
bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"

# ==========================================
# PLUGINS (TPM)
# ==========================================

# configure tmux plugin manager (tpm)
# tpm can install plugin via prefix+i
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
#set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
#set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

#set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
# set -g @continuum-restore 'on' # enable tmux-continuum functionality

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
